<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon</title>
  <!--ye neeche wala get kerte hai font-awesome se jo help kerta hai pass ke server se image or video ko extract kerne me-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="Amazon.css">
</head>

<body>
  <header>
    <div class="navbar">
      <div class="nav-logo border">
        <div class="logo"></div>
      </div>

      <div class="nav-address border">
        <p class="Deliver">Deliver to</p>
        <div class="add-icon">

          <i class="fa-solid fa-location-dot" style="color: rgb(255, 255, 255);"></i>
          <p class="country">India</p>
        </div>
      </div>

      <!--search wala part-->
      <div class="nav-search">
        <select class="search-select">
          <option>All</option>
        </select>
        <input type="text" placeholder="Search Amazon.in" class="input">
        <div class="search-icon">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
      </div>


      <!--sign in-->
      <div class="sign-in border">
        <p><span>Hello, sign-in</span></p>
        <p class="para2">Account & Lists</p>
      </div>

      <!--Return&order-->
      <div class="return border">
        <p><span>Returns</span></p>
        <p class="para2">& Orders</p>
      </div>

      <!--cart-->
      <div class="nav-cart border">
        <i class="fa-solid fa-cart-shopping" style="color: rgb(255, 255, 255);"></i>
        Cart

      </div>
    </div>
           <!--Panals-->
    <div class="panel">
    <div class="panel-all">
      <i class="fa-solid fa-bars" style="color: rgb(184, 81, 81);"></i>
      All
    </div>
    <div class="panel-ops " >
      <p>Fresh</p>
      <p>MX player</p>
      <p>Sell</p>
      <p>Bestseller</p>
      <p>Mobile</p>
      <p>Today's Deals</p>
    </div>
    <div class="panel-deal">
      Shop Deals in electronics
    </div>
</div>
  </header>

  <div class="hero-section">
    <div class="shop-section">
    <div class="box1 box">
      <h2>Up to 50% off | International brands</h2>
      <div class="img1"></div>
      <h3><a href="">see all offers</a></h3>
    </div>
    <div class="box2 box">box2</div>
    <div class="box3 box">box3</div>
    <div class="box4 box">box1</div>
  </div>
  </div>
  </div>
  

  
</body>

</html>
